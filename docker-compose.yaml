services:
  postgres:
    image: postgres:16-alpine
    container_name: library_postgres
    environment:
      POSTGRES_USER: library
      POSTGRES_PASSWORD: library
      POSTGRES_DB: library
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U library"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: library_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  solr:
    image: solr:9.6
    container_name: library_solr
    command: ["solr-precreate", "books"]
    ports:
      - "8983:8983"
    volumes:
      - solr_data:/var/solr
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -f http://localhost:8983/solr/books/admin/ping || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: library_backend
    environment:
      DATABASE_URL: postgresql://library:library@postgres:5432/library
      SOLR_URL: http://solr:8983/solr
      SOLR_CORE: books
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_PUBLIC_ENDPOINT: http://localhost:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_BUCKET: library-books
      MINIO_USE_SSL: false
      PORT: 3000
      JWT_SECRET: super-secret-jwt-key-change-in-production
      ADMIN_SECRET: supersecret123
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      solr:
        condition: service_healthy
      minio:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: library_frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pg_data:
  minio_data:
  solr_data:
